<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alex Voice — Traductor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080f;--surface:rgba(15,20,40,.7);--surface2:rgba(25,32,60,.6);
  --border:rgba(255,255,255,.06);--borderHover:rgba(255,255,255,.12);
  --text:#e8ecf4;--textDim:#7a8ab0;--textMuted:#4a567a;
  --accent:#a855f7;--accent2:#9333ea;--accentGlow:rgba(168,85,247,.12);
  --success:#10b981;--warn:#f59e0b;--error:#ef4444;
  --radius:14px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 500px 400px at 70% 20%,rgba(168,85,247,.05),transparent),radial-gradient(ellipse 400px 300px at 30% 80%,rgba(99,102,241,.04),transparent);pointer-events:none}

/* ── Top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);position:relative;z-index:10;flex-shrink:0}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .logo{font-size:16px;font-weight:700;background:linear-gradient(135deg,#c084fc,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .brand .pill{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(168,85,247,.1);color:var(--accent);border:1px solid rgba(168,85,247,.2);font-weight:500}
.topbar .actions{display:flex;gap:8px;align-items:center}
.back-btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--textDim);font-family:inherit;font-size:11px;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:var(--accent);color:var(--text)}
.stats-pill{font-size:10px;color:var(--textDim);display:flex;gap:12px}
.stats-pill .val{color:var(--text);font-weight:500}

/* ── Main split layout ── */
.app{flex:1;display:flex;overflow:hidden;position:relative;z-index:1}
.panel-left,.panel-right{flex:1;display:flex;flex-direction:column;padding:20px;min-width:0}
.panel-left{border-right:1px solid var(--border)}

/* ── Language selectors (top pills) ── */
.lang-bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:0 20px;margin-bottom:16px;flex-shrink:0;position:relative;z-index:2}
.lang-pill{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--textDim);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px);font-family:inherit}
.lang-pill:hover{border-color:var(--borderHover);color:var(--text)}
.lang-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang-pill select{background:transparent;border:none;color:inherit;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;padding-right:4px}
.lang-pill select option{background:#1a2340;color:var(--text)}
.swap-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--textDim);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.swap-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Panel content ── */
.panel-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--textMuted);margin-bottom:10px;font-weight:600}
.panel-text{flex:1;font-size:18px;line-height:1.6;color:var(--text);overflow-y:auto;padding:8px 0}
.panel-text.empty{color:var(--textMuted);font-style:italic;font-size:14px}
.panel-text.translated{color:var(--accent)}
.panel-meta{font-size:10px;color:var(--textDim);margin-top:8px;display:flex;gap:12px;flex-shrink:0}

/* ── Audio controls ── */
.audio-controls{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.play-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.play-btn:hover{background:var(--accent2);box-shadow:0 4px 16px rgba(168,85,247,.3)}
.play-btn:disabled{opacity:.3;cursor:not-allowed}
.audio-controls audio{flex:1;height:32px;border-radius:6px}
.audio-info{font-size:10px;color:var(--textDim);min-width:80px;text-align:right;flex-shrink:0}

/* ── Input area ── */
.input-area{padding:12px 20px 16px;border-top:1px solid var(--border);background:var(--surface);backdrop-filter:blur(12px);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.mic-btn{width:42px;height:42px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--textDim);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.mic-btn:hover{border-color:var(--accent);color:var(--text)}
.mic-btn.recording{background:#dc2626;color:#fff;border-color:#dc2626;animation:recPulse 1.5s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 8px rgba(220,38,38,.3)}50%{box-shadow:0 0 20px rgba(220,38,38,.5)}}
.mic-btn:disabled{opacity:.3;cursor:not-allowed}
textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;resize:none;outline:none;min-height:42px;max-height:100px;transition:border-color .2s;line-height:1.4}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentGlow)}
textarea::placeholder{color:var(--textMuted)}
.translate-btn{width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px}
.translate-btn:hover{background:var(--accent2);box-shadow:0 4px 12px rgba(168,85,247,.3)}
.translate-btn:disabled{opacity:.4;cursor:not-allowed}
.asr-line{font-size:10px;color:var(--warn);min-height:14px;margin-top:6px}

/* ── Loading ── */
.loading{display:none;text-align:center;padding:16px;color:var(--textDim)}
.loading.show{display:block}
.loading .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Voice settings ── */
.voice-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--textDim);font-size:11px;font-family:inherit;cursor:pointer;transition:all .2s;margin-bottom:8px;width:fit-content}
.voice-toggle:hover{border-color:var(--accent);color:var(--text)}
.voice-toggle.open{border-color:var(--accent);color:var(--accent)}
.voice-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;animation:fadeIn .25s}
.voice-panel.open{display:block}
.voice-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.voice-row:last-child{margin-bottom:0}
.voice-row label{font-size:11px;color:var(--textDim);min-width:60px;font-weight:500}
.voice-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:2px;outline:none}
.voice-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);box-shadow:0 0 4px rgba(168,85,247,.4)}
.voice-row input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface)}
.voice-row .range-val{font-size:10px;color:var(--textDim);min-width:28px;text-align:right}
.voice-preview{font-size:10px;color:var(--textDim);font-style:italic;padding:6px 8px;background:var(--surface2);border-radius:4px;margin-top:8px;line-height:1.4}

/* ── Footer ── */
.footer-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 20px;font-size:10px;color:var(--textMuted);border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.footer-bar .ok{color:var(--success)}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

@media(max-width:768px){
  .app{flex-direction:column}
  .panel-left{border-right:none;border-bottom:1px solid var(--border)}
  .panel-left,.panel-right{padding:14px}
  .lang-bar{padding:0 14px}
  .panel-text{font-size:15px}
  .stats-pill{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="logo">⚡ Alex Voice</span>
    <span class="pill">TRADUCTOR</span>
  </div>
  <div class="stats-pill">
    <span id="transTime"></span>
  </div>
  <div class="actions">
    <button class="back-btn" onclick="goToMenu()">← Menú</button>
  </div>
</div>

<div class="lang-bar">
  <div class="lang-pill">
    <select id="fromLang" onchange="updateLabels()">
      <option value="auto">🌐 Auto</option>
      <option value="en">🇬🇧 EN</option>
      <option value="es">🇪🇸 ES</option>
      <option value="ja">🇯🇵 JA</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="de">🇩🇪 DE</option>
    </select>
  </div>
  <button class="swap-btn" onclick="swapLangs()" title="Intercambiar">⇄</button>
  <div class="lang-pill">
    <select id="toLang" onchange="updateLabels()">
      <option value="es">🇪🇸 ES</option>
      <option value="en">🇬🇧 EN</option>
      <option value="ja">🇯🇵 JA</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="de">🇩🇪 DE</option>
    </select>
  </div>
</div>

<div class="app">
  <div class="panel-left">
    <div class="panel-label">📝 Original</div>
    <div class="panel-text empty" id="originalText">Escribe o habla para traducir...</div>
    <div class="panel-meta" id="originalMeta"></div>
  </div>
  <div class="panel-right">
    <div class="panel-label">🌍 Traducción</div>
    <div class="panel-text translated empty" id="translatedText">La traducción aparecerá aquí...</div>
    <div class="panel-meta" id="translatedMeta"></div>
  </div>
</div>

<div class="audio-controls">
  <button class="play-btn" id="playBtn" onclick="playAudio()" disabled>▶</button>
  <audio id="audioPlayer" controls></audio>
  <div class="audio-info" id="audioInfo">—</div>
</div>

<div class="input-area">
  <button class="voice-toggle" id="voiceToggle" onclick="toggleVoicePanel()">🎙️ Ajustes de voz <span style="margin-left:auto;font-size:10px">▾</span></button>
  <div class="voice-panel" id="voicePanel">
    <div class="voice-row">
      <label>Calma</label>
      <input type="range" id="sliderCalm" min="0" max="100" value="70" oninput="updateVoicePreview()">
      <span class="range-val" id="valCalm">70</span>
    </div>
    <div class="voice-row">
      <label>Velocidad</label>
      <input type="range" id="sliderSpeed" min="0" max="100" value="40" oninput="updateVoicePreview()">
      <span class="range-val" id="valSpeed">40</span>
    </div>
    <div class="voice-row">
      <label>Calidez</label>
      <input type="range" id="sliderWarmth" min="0" max="100" value="65" oninput="updateVoicePreview()">
      <span class="range-val" id="valWarmth">65</span>
    </div>
    <div class="voice-preview" id="voicePreview">Voz tranquila y cálida, ritmo pausado.</div>
  </div>
  <div class="input-row">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Grabar voz">🎤</button>
    <textarea id="input" placeholder="Escribe texto para traducir..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doTranslate()}" oninput="autoResize(this)"></textarea>
  </div>
  <div class="asr-line" id="asrLine"></div>
  <div class="loading" id="loading"><div class="spinner"></div><span id="loadingText">Traduciendo...</span></div>
  <button class="translate-btn" id="translateBtn" onclick="doTranslate()">🌍 Traducir</button>
</div>

<div class="footer-bar">
  <span class="ok" id="footerStatus">✅ Listo</span>
  <span>⚡ MarianMT ~100ms · 🎵 Kokoro ONNX</span>
</div>

<script>
const API=window.location.origin;
let currentAudioBlob=null,currentAudioUrl=null,isRecording=false,mediaRecorder=null,audioChunks=[],isTranslating=false;

function goToMenu(){fetch('http://localhost:5000/api/stop',{method:'POST'}).catch(()=>{});window.location.href='http://localhost:5000'}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px'}

function toggleVoicePanel(){
  const p=document.getElementById('voicePanel'),t=document.getElementById('voiceToggle');
  const open=p.classList.toggle('open');t.classList.toggle('open',open);
}

function buildInstruct(lang){
  const calm=+document.getElementById('sliderCalm').value;
  const speed=+document.getElementById('sliderSpeed').value;
  const warmth=+document.getElementById('sliderWarmth').value;
  const calmMap={en:['energetic','natural','calm, soft'],es:['enérgica','natural','tranquila, suave'],ja:['元気で活発な','自然な','穏やかで柔らかな']};
  const cArr=calmMap[lang]||calmMap.es;const ci=calm<=30?0:(calm<=60?1:2);
  const st=speed<=30?(lang==='ja'?'ゆっくりと':speed<=30?'Lento':'Natural'):(speed<=60?'Natural':'Rápido');
  const wt=warmth<=30?'neutro':(warmth<=65?'cálido':'muy cálido');
  return `Voz ${cArr[ci]}, ${st}, tono ${wt}.`;
}

function updateVoicePreview(){document.getElementById('valCalm').textContent=document.getElementById('sliderCalm').value;document.getElementById('valSpeed').textContent=document.getElementById('sliderSpeed').value;document.getElementById('valWarmth').textContent=document.getElementById('sliderWarmth').value;document.getElementById('voicePreview').textContent='💬 '+buildInstruct(document.getElementById('toLang').value)}

function setStatus(m,busy){const e=document.getElementById('footerStatus');e.textContent=m;e.className=busy?'busy':'ok'}
function swapLangs(){const f=document.getElementById('fromLang'),t=document.getElementById('toLang');if(f.value==='auto')return;const tmp=f.value;f.value=t.value;t.value=tmp;updateLabels()}
function updateLabels(){}

async function doTranslate(){
  if(isTranslating)return;
  const text=document.getElementById('input').value.trim();if(!text)return;
  const from=document.getElementById('fromLang').value,to=document.getElementById('toLang').value;
  isTranslating=true;document.getElementById('loading').classList.add('show');document.getElementById('loadingText').textContent='Traduciendo...';
  document.getElementById('translateBtn').disabled=true;setStatus('🔄 Traduciendo...',true);
  try{
    document.getElementById('originalText').textContent=text;document.getElementById('originalText').classList.remove('empty');
    document.getElementById('originalMeta').textContent='📝 '+from+' → '+to;
    document.getElementById('translatedText').textContent='...';document.getElementById('translatedText').classList.remove('empty');
    const r=await fetch(API+'/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,from_lang:from,to_lang:to})});
    const d=await r.json();
    if(d.error){setStatus('❌ '+d.error);document.getElementById('translatedText').textContent=d.error;isTranslating=false;document.getElementById('translateBtn').disabled=false;document.getElementById('loading').classList.remove('show');return}
    document.getElementById('translatedText').textContent=d.translation;
    document.getElementById('translatedMeta').textContent='⚡ '+d.translation_time_ms+'ms';
    document.getElementById('transTime').textContent='⚡ '+d.translation_time_ms+'ms';
    document.getElementById('loading').classList.remove('show');document.getElementById('loadingText').textContent='Generando audio...';
    document.getElementById('loading').classList.add('show');
    const instruct=buildInstruct(to);
    const aR=await fetch(API+'/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:d.translation,language:{en:'English',es:'Spanish',ja:'Japanese',fr:'French',de:'German'}[to]||'English',instruct})});
    if(!aR.ok){const e=await aR.json();setStatus('❌ TTS: '+(e.error||''));document.getElementById('loading').classList.remove('show');isTranslating=false;document.getElementById('translateBtn').disabled=false;return}
    if(currentAudioUrl)URL.revokeObjectURL(currentAudioUrl);
    currentAudioBlob=await aR.blob();currentAudioUrl=URL.createObjectURL(currentAudioBlob);
    const ap=document.getElementById('audioPlayer');ap.src=currentAudioUrl;
    const gt=aR.headers.get('X-Generation-Time-Ms')||'?';const dur=aR.headers.get('X-Audio-Duration-S')||'?';
    document.getElementById('loading').classList.remove('show');
    document.getElementById('audioInfo').textContent=gt+'ms · '+dur+'s';
    document.getElementById('playBtn').disabled=false;
    ap.oncanplaythrough=()=>{ap.play();document.getElementById('playBtn').textContent='⏸';ap.oncanplaythrough=null};
    setStatus('✅ Listo');
  }catch(e){setStatus('❌ '+e.message);document.getElementById('loading').classList.remove('show')}
  isTranslating=false;document.getElementById('translateBtn').disabled=false;
}

function playAudio(){const a=document.getElementById('audioPlayer');if(a.src){a.paused?a.play():a.pause();document.getElementById('playBtn').textContent=a.paused?'▶':'⏸'}}

async function toggleMic(){
  if(isRecording){if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();isRecording=false;document.getElementById('micBtn').classList.remove('recording');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:16000}});
    mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});audioChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data)};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());if(!audioChunks.length)return;
      document.getElementById('asrLine').textContent='🔄 Transcribiendo...';setStatus('🔄 ASR...',true);
      const blob=new Blob(audioChunks,{type:'audio/webm'});const wav=await toWav(blob);const b64=await toB64(wav);
      try{const r=await fetch(API+'/api/asr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,lang:document.getElementById('fromLang').value})});const d=await r.json();
        if(d.error){document.getElementById('asrLine').textContent='❌ '+d.error;setStatus('✅ Listo');return}
        document.getElementById('asrLine').textContent='🎤 '+d.text;document.getElementById('input').value=d.text;
        setTimeout(()=>doTranslate(),400);
      }catch(e){document.getElementById('asrLine').textContent='❌ '+e.message}
    };
    mediaRecorder.start();isRecording=true;document.getElementById('micBtn').classList.add('recording');setStatus('🎤 Grabando...',true);
    document.getElementById('asrLine').textContent='🎤 Habla ahora...';
    setTimeout(()=>{if(isRecording){mediaRecorder.stop();isRecording=false;document.getElementById('micBtn').classList.remove('recording')}},8000);
  }catch(e){document.getElementById('asrLine').textContent='❌ '+e.message}
}

async function toWav(blob){const ac=new(window.AudioContext||window.webkitAudioContext)();const buf=await ac.decodeAudioData(await blob.arrayBuffer());const pcm=buf.getChannelData(0);const tsr=16000;const ratio=buf.sampleRate/tsr;const nl=Math.round(pcm.length/ratio);const res=new Float32Array(nl);let ob=0;for(let o=0;o<nl;o++){const nb=Math.min(pcm.length,Math.round((o+1)*ratio));let a=0,c=0;for(let i=ob;i<nb;i++){a+=pcm[i];c++}res[o]=c?a/c:0;ob=nb}const i16=new Int16Array(res.length);for(let i=0;i<res.length;i++){const s=Math.max(-1,Math.min(1,res[i]));i16[i]=s<0?s*32768:s*32767}const ds=i16.length*2;const ab=new ArrayBuffer(44+ds);const v=new DataView(ab);const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+ds,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,tsr,true);v.setUint32(28,tsr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,ds,true);for(let i=0;i<i16.length;i++)v.setInt16(44+i*2,i16[i],true);return new Blob([ab],{type:'audio/wav'})}
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onloadend=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}

document.getElementById('input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doTranslate()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('input').value='';document.getElementById('originalText').textContent='Escribe o habla para traducir...';document.getElementById('originalText').classList.add('empty');document.getElementById('translatedText').textContent='La traducción aparecerá aquí...';document.getElementById('translatedText').classList.add('empty');if(currentAudioUrl){URL.revokeObjectURL(currentAudioUrl);currentAudioUrl=null}document.getElementById('audioPlayer').src='';document.getElementById('playBtn').disabled=true}});
updateLabels();
</script>
</body>
</html>
