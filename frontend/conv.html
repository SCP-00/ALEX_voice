<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alex Voice — Conversación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080f;--surface:rgba(15,20,40,.7);--surface2:rgba(25,32,60,.6);
  --border:rgba(255,255,255,.06);--borderHover:rgba(255,255,255,.12);
  --text:#e8ecf4;--textDim:#7a8ab0;--textMuted:#4a567a;
  --accent:#06b6d4;--accent2:#0891b2;--accentGlow:rgba(6,182,212,.12);
  --success:#10b981;--warn:#f59e0b;--error:#ef4444;
  --radius:14px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 600px 500px at 50% 30%,rgba(6,182,212,.05),transparent);pointer-events:none}

/* ── Top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);position:relative;z-index:10;flex-shrink:0}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .logo{font-size:16px;font-weight:700;background:linear-gradient(135deg,#22d3ee,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .brand .pill{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(6,182,212,.1);color:var(--accent);border:1px solid rgba(6,182,212,.2);font-weight:500}
.topbar .actions{display:flex;gap:8px;align-items:center}
.back-btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--textDim);font-family:inherit;font-size:11px;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:var(--accent);color:var(--text)}
.stats-pill{font-size:10px;color:var(--textDim);display:flex;gap:12px}
.stats-pill .val{color:var(--text);font-weight:500}

/* ── Messages ── */
.messages{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.welcome{text-align:center;padding:30px 20px;color:var(--textDim)}
.welcome .emoji{font-size:56px;margin-bottom:12px;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
.welcome p{font-size:13px;line-height:1.6;max-width:380px;margin:0 auto}
.welcome .lang-hint{font-size:11px;color:var(--accent);margin-top:12px;padding:6px 14px;background:var(--accentGlow);border-radius:20px;display:inline-block}

.msg{max-width:82%;padding:12px 16px;border-radius:var(--radius);line-height:1.55;font-size:13.5px;animation:msgIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .ts{font-size:9px;color:var(--textDim);margin-top:6px;opacity:.5}
.msg-toolbar{display:flex;gap:6px;margin-top:8px}
.msg-toolbar button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--textDim);font-size:10px;cursor:pointer;transition:all .2s;font-family:inherit}
.msg-toolbar button:hover{border-color:var(--accent);color:var(--text);background:var(--accentGlow)}

/* ── Voice pulse (center) ── */
.voice-area{display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px;flex-shrink:0}
.pulse-ring{position:relative;width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.pulse-ring:hover{transform:scale(1.05)}
.pulse-ring:active{transform:scale(.97)}
.pulse-ring .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--border);transition:all .3s}
.pulse-ring.listening .ring{border-color:var(--accent);box-shadow:0 0 20px var(--accentGlow),inset 0 0 20px var(--accentGlow);animation:pulseGlow 2s ease-in-out infinite}
.pulse-ring.thinking .ring{border-color:var(--warn);animation:pulseGlow 1s ease-in-out infinite}
.pulse-ring.speaking .ring{border-color:var(--success);animation:speakPulse .6s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 10px var(--accentGlow)}50%{box-shadow:0 0 30px var(--accentGlow)}}
@keyframes speakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse-icon{font-size:36px;position:relative;z-index:1;transition:all .3s}
.pulse-ring.listening .pulse-icon{filter:drop-shadow(0 0 8px var(--accent))}
.pulse-ring.speaking .pulse-icon{filter:drop-shadow(0 0 12px var(--success))}
.voice-label{font-size:11px;color:var(--textDim);font-weight:500;min-height:16px;text-align:center}
.voice-label.active{color:var(--accent)}

/* ── Waveform canvas ── */
.waveform{width:200px;height:40px;opacity:0;transition:opacity .3s}
.waveform.show{opacity:1}

/* ── Input ── */
.input-area{padding:10px 20px 14px;border-top:1px solid var(--border);background:var(--surface);backdrop-filter:blur(12px);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;resize:none;outline:none;min-height:42px;max-height:100px;transition:border-color .2s}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentGlow)}
textarea::placeholder{color:var(--textMuted)}
.send-btn{width:42px;height:42px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.send-btn:hover{background:var(--accent2);box-shadow:0 4px 12px rgba(6,182,212,.3)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.asr-line{font-size:10px;color:var(--warn);min-height:14px;margin-top:6px}
.input-footer{display:flex;gap:14px;margin-top:5px;font-size:10px;color:var(--textMuted)}
.input-footer .ok{color:var(--success)}

/* ── Thinking ── */
.thinking{display:none;align-self:flex-start;gap:5px;padding:10px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);margin-top:4px}
.thinking.show{display:inline-flex}
.thinking span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dotBounce 1.4s infinite}
.thinking span:nth-child(2){animation-delay:.15s}
.thinking span:nth-child(3){animation-delay:.3s}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

@media(max-width:768px){
  .messages{padding:12px 14px}
  .input-area{padding:8px 14px 12px}
  .pulse-ring{width:100px;height:100px}
  .pulse-icon{font-size:30px}
  .stats-pill{display:none}
  .msg{max-width:90%}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="logo">⚡ Alex Voice</span>
    <span class="pill">CONVERSACIÓN</span>
  </div>
  <div class="stats-pill">
    <span>⚡ <span class="val" id="sTok">—</span> tok/s</span>
    <span>💾 <span class="val" id="sVram">—</span> GB</span>
  </div>
  <div class="actions">
    <button class="back-btn" onclick="goToMenu()">← Menú</button>
  </div>
</div>

<div class="messages" id="msgs">
  <div class="welcome">
    <span class="emoji">💬</span>
    <h3>Conversación Libre</h3>
    <p>Habla sobre cualquier tema. Respondo en el mismo idioma que uses, con memoria de toda la conversación.</p>
    <div class="lang-hint">🎤 Toca el micrófono o escribe para empezar a charlar</div>
  </div>
</div>
<div class="thinking" id="think"><span></span><span></span><span></span></div>

<div class="voice-area">
  <div class="pulse-ring" id="pulseRing" onclick="toggleMic()">
    <div class="ring"></div>
    <span class="pulse-icon" id="pulseIcon">🎤</span>
  </div>
  <div class="voice-label" id="voiceLabel">Toca para hablar</div>
  <canvas class="waveform" id="waveform" width="200" height="40"></canvas>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" placeholder="O escribe un mensaje..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
  </div>
  <div class="asr-line" id="asrLine"></div>
  <div class="input-footer">
    <span class="ok" id="footerStatus">✅ Listo</span>
  </div>
</div>

<script>
function goToMenu(){fetch('http://localhost:5000/api/stop',{method:'POST'}).catch(()=>{});window.location.href='http://localhost:5000'}

const API=window.location.origin;
let messageHistory=[],isProcessing=false,audioCtx=null,mediaRecorder=null,audioChunks=[],isRecording=false,isTtsPlaying=false,animFrame=null,audioAnalyser=null;

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px'}

function addMsg(role,text,extra={}){
  const d=document.createElement('div');d.className='msg '+role;
  const span=document.createElement('span');span.textContent=text;d.appendChild(span);
  const ts=document.createElement('div');ts.className='ts';ts.textContent=new Date().toLocaleTimeString();d.appendChild(ts);
  if(role==='assistant'){
    const tb=document.createElement('div');tb.className='msg-toolbar';
    const spk=document.createElement('button');spk.textContent='🔊 Hablar';
    spk.onclick=()=>speakTTS(text);tb.appendChild(spk);
    const cpy=document.createElement('button');cpy.textContent='📋 Copiar';
    cpy.onclick=()=>{navigator.clipboard.writeText(text);cpy.textContent='✅';setTimeout(()=>cpy.textContent='📋 Copiar',1500)};tb.appendChild(cpy);
    d.appendChild(tb);
  }
  document.getElementById('msgs').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function setPulse(state){
  const ring=document.getElementById('pulseRing');
  const label=document.getElementById('voiceLabel');
  const icon=document.getElementById('pulseIcon');
  ring.className='pulse-ring '+state;
  const labels={listening:'Escuchando...',thinking:'Pensando...',speaking:'Hablando...',stopped:'Toca para hablar'};
  label.textContent=labels[state]||'Toca para hablar';
  label.className='voice-label'+(state==='listening'?' active':'');
  icon.textContent=state==='speaking'?'🔊':state==='thinking'?'🧠':state==='listening'?'🎤':'🎤';
}

function setThinking(on){
  document.getElementById('think').classList.toggle('show',on);
  document.getElementById('sendBtn').disabled=on;
  if(on)setPulse('thinking');else if(!isRecording)setPulse('stopped');
}
function setStatus(m){document.getElementById('footerStatus').textContent=m}

async function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();if(!text||isProcessing)return;
  addMsg('user',text);input.value='';input.style.height='auto';
  
  // Create placeholder for streaming
  const placeholderDiv=document.createElement('div');
  placeholderDiv.className='msg assistant';
  const placeholderSpan=document.createElement('span');
  placeholderSpan.textContent='';
  placeholderDiv.appendChild(placeholderSpan);
  document.getElementById('msgs').appendChild(placeholderDiv);
  
  isProcessing=true;setThinking(true);setStatus('🧠 Generando...');
  try{
    const userMsg={role:'user',content:text};
    const msgs=messageHistory.concat([userMsg]);
    const r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:msgs,mode:'conversation',n_predict:512,temperature:0.7,stream:true})});
    
    const ct=r.headers.get('Content-Type')||'';
    let fullContent='';
    
    if(ct.includes('text/event-stream')){
      const reader=r.body.getReader();
      const decoder=new TextDecoder();
      let buf='';
      while(true){
        const{done,value}=await reader.read();
        if(done)break;
        buf+=decoder.decode(value,{stream:true});
        const lines=buf.split('\n');
        buf=lines.pop();
        for(const line of lines){
          if(line.startsWith('data: ')){
            const d=line.slice(6).trim();
            if(d&&d!=='[DONE]'){
              try{
                const p=JSON.parse(d);
                const delta=p.choices[0].delta.content||'';
                if(delta){fullContent+=delta;placeholderSpan.textContent=fullContent;placeholderDiv.scrollIntoView({behavior:'smooth'})}
              }catch(e){}
            }
          }
        }
      }
    }else{
      const data=await r.json();
      fullContent=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||data.content||'[sin respuesta]';
      placeholderSpan.textContent=fullContent;
    }
    
    if(!fullContent)fullContent='[sin respuesta]';
    placeholderSpan.textContent=fullContent;
    
    // Add toolbar
    const tb=document.createElement('div');tb.className='msg-toolbar';
    const spk=document.createElement('button');spk.textContent='🔊 Hablar';
    spk.onclick=()=>speakTTS(fullContent);tb.appendChild(spk);
    const cpy=document.createElement('button');cpy.textContent='📋 Copiar';
    cpy.onclick=()=>{navigator.clipboard.writeText(fullContent);cpy.textContent='✅';setTimeout(()=>cpy.textContent='📋 Copiar',1500)};tb.appendChild(cpy);
    placeholderDiv.appendChild(tb);
    
    const ts=document.createElement('div');ts.className='ts';ts.textContent=new Date().toLocaleTimeString();
    placeholderDiv.appendChild(ts);
    
    messageHistory.push(userMsg,{role:'assistant',content:fullContent});
    if(messageHistory.length>20)messageHistory=messageHistory.slice(-20);
    setStatus('✅ Listo');
    if(fullContent.length<500&&!isRecording)speakTTS(fullContent);
  }catch(e){placeholderSpan.textContent='⚠️ '+e.message;setStatus('❌ Error')}
  isProcessing=false;setThinking(false);
}

async function speakTTS(text){
  if(!text||text.length>2000)return;
  setPulse('speaking');setStatus('🎙️ Audio...');
  try{
    const r=await fetch(API+'/api/tts/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,lang:'auto'})});
    if(!r.ok){const r2=await fetch(API+'/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,lang:'auto'})});if(!r2.ok)return;isTtsPlaying=true;const blob=await r2.blob();await playBlob(blob);return}
    const sr=parseInt(r.headers.get('X-Sample-Rate')||'24000');
    const reader=r.body.getReader();
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const buf=audioCtx.createBuffer(1,44100*60,sr);let offset=0,total=0;
    while(true){const{done,value}=await reader.read();if(done)break;const i16=new Int16Array(value.buffer);const f32=new Float32Array(i16.length);for(let i=0;i<i16.length;i++)f32[i]=i16[i]/32768;buf.getChannelData(0).set(f32,offset);offset+=f32.length;total+=f32.length}
    if(total===0)return;
    const final=audioCtx.createBuffer(1,total,sr);final.getChannelData(0).set(buf.getChannelData(0).subarray(0,total));
    const src=audioCtx.createBufferSource();src.buffer=final;src.connect(audioCtx.destination);src.start(0);
    isTtsPlaying=true;setPulse('speaking');
    src.onended=()=>{isTtsPlaying=false;setPulse('stopped');setStatus('✅ Listo')};
  }catch(e){setPulse('stopped');setStatus('✅ Listo')}
}

async function playBlob(blob){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const buf=await audioCtx.decodeAudioData(await blob.arrayBuffer());
  const s=audioCtx.createBufferSource();s.buffer=buf;s.connect(audioCtx.destination);s.start(0);isTtsPlaying=true;
  s.onended=()=>{isTtsPlaying=false;setPulse('stopped');setStatus('✅ Listo')};
}

async function toggleMic(){
  if(isRecording){if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();isRecording=false;setPulse('stopped');return}
  if(isTtsPlaying)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,sampleRate:16000}});
    mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});audioChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data)};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      if(!audioChunks.length){setPulse('stopped');return}
      setPulse('thinking');setStatus('🔄 Transcribiendo...');
      const blob=new Blob(audioChunks,{type:'audio/webm'});const wav=await toWav(blob);const b64=await toB64(wav);
      try{const r=await fetch(API+'/api/asr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,lang:'auto'})});const d=await r.json();
        if(d.error){document.getElementById('asrLine').textContent='❌ '+d.error;setPulse('stopped');return}
        if(!d.text||d.text.length<2){setPulse('stopped');return}
        document.getElementById('asrLine').textContent='🗣️ '+d.text;
        const userMsg={role:'user',content:d.text};const msgs=messageHistory.concat([userMsg]);
        addMsg('user',d.text);
        // Create placeholder for streaming voice response
        const vPlaceholderDiv=document.createElement('div');
        vPlaceholderDiv.className='msg assistant';
        const vPlaceholderSpan=document.createElement('span');
        vPlaceholderSpan.textContent='';
        vPlaceholderDiv.appendChild(vPlaceholderSpan);
        document.getElementById('msgs').appendChild(vPlaceholderDiv);
        isProcessing=true;setThinking(true);
        let vFullContent='';
        try{
          const cr=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,mode:'conversation',n_predict:512,temperature:0.7,stream:true})});
          const ct=cr.headers.get('Content-Type')||'';
          if(ct.includes('text/event-stream')){
            const reader=cr.body.getReader();const decoder=new TextDecoder();let buf='';
            while(true){const{done,value}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){if(line.startsWith('data: ')){const d=line.slice(6).trim();if(d&&d!=='[DONE]'){try{const p=JSON.parse(d);const delta=p.choices[0].delta.content||'';if(delta){vFullContent+=delta;vPlaceholderSpan.textContent=vFullContent;vPlaceholderDiv.scrollIntoView({behavior:'smooth'})}}catch(e){}}}}}
          }else{const cd=await cr.json();vFullContent=(cd.choices&&cd.choices[0]&&cd.choices[0].message&&cd.choices[0].message.content)||cd.content||'';vPlaceholderSpan.textContent=vFullContent}
        }catch(e){vPlaceholderSpan.textContent='⚠️ Error'}
        if(!vFullContent)vFullContent='[sin respuesta]';vPlaceholderSpan.textContent=vFullContent;
        setStatus('✅ Listo');
        // Add toolbar
        const vTb=document.createElement('div');vTb.className='msg-toolbar';
        const vSpk=document.createElement('button');vSpk.textContent='🔊 Hablar';
        vSpk.onclick=()=>speakTTS(vFullContent);vTb.appendChild(vSpk);
        const vCpy=document.createElement('button');vCpy.textContent='📋 Copiar';
        vCpy.onclick=()=>{navigator.clipboard.writeText(vFullContent);vCpy.textContent='✅';setTimeout(()=>vCpy.textContent='📋 Copiar',1500)};vTb.appendChild(vCpy);
        vPlaceholderDiv.appendChild(vTb);
        const vTs=document.createElement('div');vTs.className='ts';vTs.textContent=new Date().toLocaleTimeString();
        vPlaceholderDiv.appendChild(vTs);
        messageHistory.push(userMsg,{role:'assistant',content:vFullContent});
        if(messageHistory.length>20)messageHistory=messageHistory.slice(-20);
        isProcessing=false;setThinking(false);
        if(vFullContent.length<500)speakTTS(vFullContent);else setPulse('stopped');
      }catch(e){setPulse('stopped')}
    };
    mediaRecorder.start();isRecording=true;setPulse('listening');setStatus('🎤 Grabando...');
    document.getElementById('asrLine').textContent='🎤 Habla ahora...';
    startWaveform(stream);
    setTimeout(()=>{if(isRecording){mediaRecorder.stop();isRecording=false}},15000);
  }catch(e){document.getElementById('asrLine').textContent='❌ '+e.message;setPulse('stopped')}
}

function startWaveform(stream){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(stream);
  audioAnalyser=audioCtx.createAnalyser();audioAnalyser.fftSize=64;src.connect(audioAnalyser);
  const canvas=document.getElementById('waveform');const ctx=canvas.getContext('2d');
  canvas.classList.add('show');
  const draw=()=>{
    if(!isRecording){canvas.classList.remove('show');return}
    animFrame=requestAnimationFrame(draw);
    const data=new Uint8Array(audioAnalyser.frequencyBinCount);audioAnalyser.getByteFrequencyData(data);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const barW=canvas.width/data.length*2.5;
    for(let i=0;i<data.length;i++){
      const h=(data[i]/255)*canvas.height;
      const x=i*(barW+1);
      ctx.fillStyle=`rgba(6,182,212,${.3+data[i]/255*.7})`;
      ctx.beginPath();ctx.roundRect(x,canvas.height-h,barW,h,2);ctx.fill();
    }
  };draw();
}

async function toWav(blob){const ac=new(window.AudioContext||window.webkitAudioContext)();const buf=await ac.decodeAudioData(await blob.arrayBuffer());const pcm=buf.getChannelData(0);const tsr=16000;const ratio=buf.sampleRate/tsr;const nl=Math.round(pcm.length/ratio);const res=new Float32Array(nl);let ob=0;for(let o=0;o<nl;o++){const nb=Math.min(pcm.length,Math.round((o+1)*ratio));let a=0,c=0;for(let i=ob;i<nb;i++){a+=pcm[i];c++}res[o]=c?a/c:0;ob=nb}const i16=new Int16Array(res.length);for(let i=0;i<res.length;i++){const s=Math.max(-1,Math.min(1,res[i]));i16[i]=s<0?s*32768:s*32767}const ds=i16.length*2;const ab=new ArrayBuffer(44+ds);const v=new DataView(ab);const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+ds,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,tsr,true);v.setUint32(28,tsr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,ds,true);for(let i=0;i<i16.length;i++)v.setInt16(44+i*2,i16[i],true);return new Blob([ab],{type:'audio/wav'})}
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onloadend=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}

async function pollStats(){
  try{const r=await fetch(API+'/api/stats');const s=await r.json();
    document.getElementById('sTok').textContent=s.tokens_per_sec||'—';
    document.getElementById('sVram').textContent=s.vram_used_mb?(s.vram_used_mb/1024).toFixed(1):'—';
  }catch(e){}
}
pollStats();setInterval(pollStats,3000);
